[project]
name = "jevmatch"
version = "0.1.0"
description = "Human-in-the-loop resume and job-description matching powered by TypeSafe Jev"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Dipesh Tripathi" }]
keywords = ["resume", "hiring", "typesafe", "jev", "fastapi", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business",
]
dependencies = [
  "anthropic>=0.49,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pdfplumber>=0.11,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "python-docx>=1.1,<2",
  "python-multipart>=0.0.18,<1",
  "rich>=13.9,<15",
  "sqlmodel>=0.0.22,<1",
  "tenacity>=9,<10",
  "trafilatura>=2,<3",
  "typer>=0.15,<1",
  "typesafe-sdk>=0.3,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.9,<1",
]

[project.scripts]
jevmatch = "cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "api", "cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
markers = ["live: requires live TypeSafe and Anthropic credentials"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".venv", "web"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"
